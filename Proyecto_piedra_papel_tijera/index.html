<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400..600;1,400&family=Playfair+Display:wght@600;700&display=swap"
        rel="stylesheet">
</head>

<body>
    <div class="caja-vintaje">
        <div class="contenedor-jugable-registro">
            <div class="parte-jugable">
                <div class="contador-rondas">

                    <h1>PIEDRA PAPEL TIJERA</h1>

                    <h3>CONTADOR DE RONDAS</h3>
                    <div class="rondas">
                        Ronda Actual: <span class="numero-rondas" id="id-rondas">0</span>
                    </div>

                </div>
                <div class="seleccion-juego">
                    <h3>SELECCIÓN DE JUGADA</h3>
                    <div class="seleccion">
                        <label class="opción">
                            <input type="radio" name="opción" value="1">
                            Piedra
                        </label>
                        <label class="opción">
                            <input type="radio" name="opción" value="2">
                            Papel
                        </label>
                        <label class="opción">
                            <input type="radio" name="opción" value="3">
                            Tijera
                        </label>
                    </div>
                    <button class="boton-selector" onclick="RondaJugada()">¡JUGAR RONDA!</button>

                    <div id="mi-modal" class="modal">
                        <div class="contenedor-fin-partida">
                            <h2>fin de la partida</h2>
                            <span id="fin-partida">0</span><br>
                            <button class="boton-fin-partida" onclick="cerrarModal()">otra partida</button>
                        </div>
                    </div>
                </div>

            </div>
            <div class="registro">
                <h2 class="titulo-registro">REGISTRO DE PARTIDAS</h2>
                <div class="panel-registro">
                    <h3 class="titulo-historial">HISTORIAL DE RONDAS</h3>
                    <ul id="lista-registro">
                    </ul>
                </div>


            </div>
        </div>
        <div class="contenedor-reglas-fin-partida">
            <div class="reglas-juego">
                <h2 class="titulo-reglas">REGLAS DEL JUEGO</h2>
                <div class="piedra-papel-tijera">
                    <p>-.Piedra aplasta a Tijera</p>
                    <p>-.Tijera corta Papel</p>
                    <p>-.Papel envuelve Piedra </p>
                    <p>-.5 rondas por partida </p>
                </div>
            </div>
            <img src="imagenes/imagen-cabrona.jpeg">
        </div>
        </div>

            <script type="module" src="script.js"></script>
</body>

</html>
